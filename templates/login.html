{% extends 'base.html' %}
{% block content %}
  <div class="card">
    <h1>Log in</h1>
    <form method="post">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>
      <button type="submit">Log in</button>
    </form>
  </div>
{% endblock %}
